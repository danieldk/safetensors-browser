steps:
  cargo_fmt:
    when:
      event: pull_request
    image: rust
    commands:
      - rustup default stable
      - rustup component add rustfmt
      - cargo fmt -- --check

  cargo_clippy:
    image: rust
    when:
      - event: pull_request
    commands:
      - rustup default stable
      - rustup component add clippy
      - cargo clippy --tests --all-targets -- -D warnings

  cargo_test:
    image: rust
    when:
      - event: pull_request
    commands:
      - rustup default stable
      - cargo test
